<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATLAS // IDENTIFICATION CARD</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 背景动态波纹层 -->
  <div class="bg-ripples" aria-hidden="true">
    <div class="ripple r1"></div>
    <div class="ripple r2"></div>
    <div class="ripple r3"></div>
  </div>

  <!-- 顶部搜索 / 标识栏（贯穿全屏横向） -->
  <header class="top-bar">
    <div class="top-bar__inner">
      <div class="brand">
        <span class="brand__mark">ATLAS</span>
        <span class="brand__sub">// SDF · ID-CARD v2.4</span>
      </div>

      <div class="search">
        <span class="search__icon">⌕</span>
        <input type="text" class="search__input" value="OMEGA-07" readonly>
        <span class="search__scan"></span>
      </div>

      <div class="status-mini">
        <span class="dot"></span>
        <span>ONLINE</span>
      </div>
    </div>
  </header>

  <!-- 主名片（横向铺满） -->
  <main class="card">

    <!-- 扫光波纹（左到右，先蓄力后冲刺） -->
    <span class="sweep" aria-hidden="true"></span>

    <!-- 边角装饰 -->
    <span class="corner corner--tl"></span>
    <span class="corner corner--tr"></span>
    <span class="corner corner--bl"></span>
    <span class="corner corner--br"></span>

    <!-- 左侧：Logo + 主身份 -->
    <section class="card__left">
      <div class="logo-frame">
        <div class="ring ring--1"></div>
        <div class="ring ring--2"></div>
        <div class="ring ring--3"></div>
        <img src="Logo.png" alt="ATLAS Logo" class="logo">
      </div>

      <div class="designation">
        <div class="label">DESIGNATION</div>
        <div class="value">/// CLASSIFIED</div>
      </div>
    </section>

    <!-- 中部：信息列 -->
    <section class="card__center">
      <div class="field">
        <div class="label">OPERATIVE</div>
        <div class="value">OMEGA-07</div>
      </div>

      <div class="field">
        <div class="label">CLEARANCE</div>
        <div class="value">LEVEL 05</div>
      </div>

      <div class="field">
        <div class="label">DIVISION</div>
        <div class="value">SDF · TITAN WATCH</div>
      </div>

      <!-- 蓄力式进度条 -->
      <div class="charge">
        <div class="charge__track">
          <div class="charge__fill"></div>
        </div>
        <div class="charge__readout">
          <span>AUTHENTICATING</span>
          <span class="charge__pct">100%</span>
        </div>
      </div>
    </section>

    <!-- 右侧：状态 + 数据 -->
    <section class="card__right">
      <div class="data-row"><span>STATUS</span><b class="ok">ONLINE</b></div>
      <div class="data-row"><span>AUTH</span><b>0x4F2A</b></div>
      <div class="data-row"><span>SESSION</span><b>2026.08.27</b></div>

      <div class="barcode" aria-hidden="true"></div>

      <div class="sig">
        <span class="sig__line"></span>
        <span class="sig__name">A. TITAN // ATLAS DIRECTOR</span>
      </div>
    </section>

  </main>

  <script>
    // 生成条形码竖线
    const bar = document.querySelector('.barcode');
    if (bar) {
      for (let i = 0; i < 40; i++) {
        const s = document.createElement('span');
        s.style.height = (30 + Math.random() * 70) + '%';
        bar.appendChild(s);
      }
    }
  </script>

</body>
</html>
