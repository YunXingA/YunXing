<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>陨篂/YunXing个人主页</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ============ 上侧搜索/信息区 ============ -->
  <div class="top-bar">
    <div class="top-left">
      <span class="vate-title">VATE</span>
      <span class="starc-sub">//StarYC · ID-褐蝎 V1.0</span>
    </div>

    <div class="top-right">
      <div class="search-wrap">
        <span class="search-icon" id="searchBtn">🔍</span>
        <input type="text" class="search-input" id="searchInput" placeholder="Input" maxlength="15" autocomplete="off">
        <div class="search-shine"></div>
      </div>
      <span class="status-dot"></span>
      <span class="status-text">ONLINE</span>
    </div>
  </div>

  <!-- ============ 下侧显示区（动画 + 内容全在这里） ============ -->
  <div class="stage" id="stage">

    <!-- 左侧红色楔形背景 -->
    <div class="red-wedge" id="redWedge"></div>

    <!-- 中间 Logo（动画中切换） -->
    <div class="logo-container">
      <img src="Logo2.png" alt="Logo" id="centerLogo" class="center-logo">
    </div>

    <!-- 白斜线（\ 方向，从右向左飞） -->
    <div class="white-streak" id="whiteStreak"></div>

    <!-- 右上角大六边形 -->
    <div class="hex-badge" id="hexBadge"></div>

    <!-- 四个红色角标（仅下侧） -->
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>
  </div>

  <script src="main.js"></script>
</body>
</html>
