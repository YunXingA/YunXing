<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>ATLAS // SDF</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="scanline"></div>

  <div class="card">
    <!-- 顶部标识栏 -->
    <div class="card-header">
      <span class="brand">ATLAS // SDF</span>
      <span class="status">
        <span class="dot"></span> ONLINE
      </span>
    </div>

    <!-- Logo 区域：带从左到右透明度渐变 -->
    <div class="logo-wrap">
      <div class="ring ring-outer"></div>
      <div class="ring ring-inner"></div>
      <img class="logo" src="Logo1.png" alt="Logo">
    </div>

    <!-- 信息栏 -->
    <div class="info">
      <div class="row">
        <span class="label">DESIGNATION</span>
        <span class="value">OMEGA-07</span>
      </div>
      <div class="row">
        <span class="label">CLEARANCE</span>
        <span class="value">LEVEL 5 // COMMAND</span>
      </div>
      <div class="row">
        <span class="label">STATUS</span>
        <span class="value glow">AWAITING DIRECTIVE</span>
      </div>
    </div>

    <!-- 底部条形码 -->
    <div class="barcode" id="barcode"></div>
  </div>

  <script>
    // 生成条形码竖线
    const bar = document.getElementById('barcode');
    for (let i = 0; i < 40; i++) {
      const line = document.createElement('div');
      line.style.cssText = `
        width:${Math.random() * 3 + 1}px;
        height:100%;
        background:rgba(0,255,200,${Math.random() * 0.5 + 0.3});
        display:inline-block;
        margin-right:${Math.random() * 3}px;
      `;
      bar.appendChild(line);
    }
  </script>
</body>
</html>
