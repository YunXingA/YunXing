<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>陨篂/YunXing的个人网址 · VATE</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ================= 开场动画层 ================= -->
  <div class="intro-layer" id="introLayer">
    <div class="intro-logo" id="introLogo">
      <img id="introLogoImg" src="Logo2.png" alt="Logo">
    </div>
    <div class="red-wedge" id="redWedge"></div>
    <div class="white-slash" id="whiteSlash"></div>
    <div class="triangle-grid" id="triangleGrid"></div>
  </div>

  <!-- ================= 主 UI ================= -->
  <div class="app" id="app">

    <!-- 顶部搜索栏 -->
    <header class="top-bar">
      <div class="top-red-wedge"></div>

      <!-- 左侧：VATE 标识 -->
      <div class="top-left">
        <div class="brand">
          <span class="brand-name">VATE</span>
          <span class="brand-sub">//StarYC · ID-褐蝎 V1.0</span>
        </div>
      </div>

      <!-- 中间：搜索框 -->
      <div class="search-box">
        <span class="search-icon" id="searchBtn" title="搜索">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="10.5" cy="10.5" r="6.5"/>
            <line x1="15.5" y1="15.5" x2="20" y2="20" stroke-linecap="round"/>
          </svg>
        </span>
        <input
          type="text"
          class="search-input"
          id="searchInput"
          maxlength="15"
          placeholder="Input"
          autocomplete="off"
          spellcheck="false"
        />
        <span class="search-shine"></span>
      </div>

      <!-- 右侧：实时世界时间 -->
      <div class="top-right">
        <span class="world-time" id="worldTime">--:--:--</span>
        <span class="status">
          <span class="status-dot"></span>
          <span class="status-text">ONLINE</span>
        </span>
      </div>

    </header>

    <!-- 主体信息区 -->
    <main class="content">
      <span class="corner corner-tl"></span>
      <span class="corner corner-tr"></span>
      <span class="corner corner-bl"></span>
      <span class="corner corner-br"></span>

      <div class="gold-polish"></div>

      <div class="content-inner">
        <div class="label">WELCOME</div>
        <div class="title">VATE IDENTIFICATION SYSTEM</div>
        <div class="subtitle">黑金 · 巨神协议已就绪</div>
      </div>
    </main>

  </div>

  <script src="main.js"></script>
</body>
</html>
