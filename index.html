<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YunXing 的个人主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
        }

        /* 星空背景粒子 */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .star {
            position: absolute;
            width: 3px;
            height: 3px;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite;
            opacity: 0;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* 主容器 */
        .container {
            text-align: center;
            z-index: 1;
            padding: 40px;
        }

        /* Hello World 标题 */
        .hello {
            font-size: clamp(2.5rem, 8vw, 5rem);
            font-weight: 800;
            background: linear-gradient(90deg, #f093fb, #f5576c, #fda085, #f093fb);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 4s ease infinite;
            letter-spacing: 2px;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* 分隔线 */
        .divider {
            width: 80px;
            height: 4px;
            background: linear-gradient(90deg, #f093fb, #f5576c);
            margin: 24px auto;
            border-radius: 2px;
            animation: expand 2s ease-in-out infinite alternate;
        }

        @keyframes expand {
            0% { width: 60px; opacity: 0.6; }
            100% { width: 120px; opacity: 1; }
        }

        /* 自我介绍 */
        .intro {
            font-size: clamp(1.2rem, 4vw, 1.8rem);
            color: rgba(255, 255, 255, 0.85);
            margin-top: 16px;
            animation: fadeInUp 1s ease 0.5s both;
        }

        .intro .name {
            color: #f5576c;
            font-weight: 700;
            position: relative;
            display: inline-block;
        }

        .intro .name::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 2px;
            background: #f5576c;
            transform: scaleX(0);
            animation: underlineGrow 1.5s ease 1.5s forwards;
            transform-origin: left;
        }

        @keyframes underlineGrow {
            to { transform: scaleX(1); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 打字光标 */
        .cursor {
            display: inline-block;
            width: 3px;
            height: 1.2em;
            background: #f5576c;
            margin-left: 4px;
            vertical-align: middle;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        /* 底部装饰 */
        .footer {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        /* 漂浮动画 */
        .float {
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>

    <!-- 星空背景 -->
    <div class="stars" id="stars"></div>

    <!-- 主内容 -->
    <div class="container float">
        <div class="hello">Hello World</div>
        <div class="divider"></div>
        <div class="intro">
            I'm <span class="name">YunXing</span><span class="cursor"></span>
        </div>
    </div>

    <div class="footer">Powered by GitHub Pages</div>

    <script>
        // 生成随机星星
        const starsContainer = document.getElementById('stars');
        const starCount = 80;

        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
            star.style.animationDelay = Math.random() * 5 + 's';
            const size = Math.random() * 3 + 1;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            starsContainer.appendChild(star);
        }
    </script>

</body>
</html>
