<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>陨篂/YunXing 个人主页</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ============ 顶部信息栏（始终显示） ============ -->
  <header class="topbar">

    <!-- 左侧：VATE + //StarYC -->
    <div class="topbar-left">
      <span class="vate">VATE</span>
      <span class="sub">//StarYC · ID-褐蝎 V1.0</span>
    </div>

    <!-- 中间：搜索框（仅框内有渐变） -->
    <div class="search">
      <input id="searchInput" type="text" maxlength="15" placeholder="Input">
      <button id="searchBtn" title="搜索">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <circle cx="10" cy="10" r="6.5" fill="none" stroke="#00ffc8" stroke-width="2"/>
          <line x1="15" y1="15" x2="20.5" y2="20.5" stroke="#00ffc8" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <!-- 右侧：日期 + 在线状态 -->
    <div class="topbar-right">
      <span class="date" id="clock">----/--/-- --:--</span>
      <span class="status">
        <span class="dot"></span>
        <span class="ok">ONLINE</span>
      </span>
    </div>
  </header>

  <!-- ============ 下方显示区（动画在此播放） ============ -->
  <main class="stage" id="stage">

    <!-- 左侧淡红色背景楔形（细，喂红色区域少） -->
    <div class="red-wedge" id="redWedge"></div>

    <!-- 中间 Logo 显示区 -->
    <div class="logo-area">
      <img id="logoImg" src="Logo2.png" alt="Logo">
    </div>

    <!-- 从右向左飞过的白色细斜条（\ 方向） -->
    <div class="white-streak" id="whiteStreak"></div>

    <!-- 右上角 7 个错列大等腰三角形 -->
    <div class="tri-group" id="triGroup"></div>

    <!-- 四个角标（仅下方显示区） -->
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

  </main>

  <script src="main.js"></script>
</body>
</html>
